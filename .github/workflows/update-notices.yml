name: Update tax department notices

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tax-notice-updater
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch official public updates
        run: python scripts/update_notices.py

      - name: Commit changed notices
        run: |
          git config user.name "CA Desk Notice Bot"
          git config user.email "actions@users.noreply.github.com"
          git add notices.json
          if git diff --cached --quiet; then
            echo "No notice changes detected."
          else
            git commit -m "Auto-update Income Tax and GST notices"
            git push
          fi
